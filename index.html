<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, interactive-widget=resizes-visual">
    <title>経穴学習アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu-screen" class="screen active">
        <h1>経穴学習アプリ</h1>
        <p>学習するジャンルを選択してください</p>
        <div class="menu-buttons">
            <button onclick="startGame(1)">1. 五兪穴・五行穴 陰経</button>
            <button onclick="startGame(2)">2. 五兪穴・五行穴 陽経</button>
            <button onclick="startGame(3)">3. 五要穴 陰経</button>
            <button onclick="startGame(4)">4. 五要穴 陽経+奇経</button>
            <button onclick="startGame(5)">5. 胸部の経穴 (縦進み)</button>
            <button onclick="startGame(6)">6. 腹部の経穴 (縦進み)</button>
            <button onclick="startGame(7)">7. 背部の経穴 (縦進み)</button>
            <a href="myaku.html">脈診アプリへ</a>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div id="info-bar">
            <button id="back-btn" onclick="returnToMenu()">戻る</button>
            <span id="current-target-info">表の空欄をタップして開始</span>
        </div>

        <div id="table-container">
            <table id="point-table"></table>
        </div>

        <div id="quiz-container" class="hidden">
            <div class="choices-grid">
                <button class="choice-btn" onclick="checkAnswer(0)"></button>
                <button class="choice-btn" onclick="checkAnswer(1)"></button>
                <button class="choice-btn" onclick="checkAnswer(2)"></button>
                <button class="choice-btn" onclick="checkAnswer(3)"></button>
                <button class="choice-btn" onclick="checkAnswer(4)"></button>
                <button class="choice-btn" onclick="checkAnswer(5)"></button>
            </div>
        </div>

        <div id="complete-message" class="hidden">
            学習完了！自由に表を確認できます。
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
